name: Update Content Submodule

on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_REPO_PAT }}
          submodules: recursive

      - name: Update submodule to latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Navigate to submodule
          cd src/content

          # Fetch latest changes
          git fetch origin

          # Hard reset to latest commit (no merge needed)
          git reset --hard origin/main

          # Get the new commit hash
          NEW_COMMIT=$(git rev-parse HEAD)
          cd ../..

          echo "Updated to commit: $NEW_COMMIT"

      - name: Commit and push changes
        env:
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_PUSHER: ${{ github.event.client_payload.pusher }}
          DISPATCH_MESSAGE: ${{ github.event.client_payload.commit_message }}
        run: |
          git add src/content
          if git diff --staged --quiet; then
            echo "No changes to commit - submodule already up to date"
            exit 0
          fi
          {
            printf '%s\n\n' 'chore: update content submodule'
            printf 'Triggered by: %s\n' "$DISPATCH_REPOSITORY"
            printf 'Content commit: %s\n' "$DISPATCH_SHA"
            printf 'Pushed by: %s\n' "$DISPATCH_PUSHER"
            printf 'Original message: %s\n' "$DISPATCH_MESSAGE"
          } > /tmp/commit_message.txt
          git commit -F /tmp/commit_message.txt
          git push origin master

      - name: Summary
        run: |
          echo "✅ Content submodule updated successfully"
          echo "🚀 Cloudflare Pages will deploy automatically"
